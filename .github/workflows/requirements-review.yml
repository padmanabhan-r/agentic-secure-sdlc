name: Security requirements review

# Runs on label changes and on edits to the issue body. Comments never trigger it:
# anyone can comment, which would let them spend the LLM budget or inject instructions.
on:
  issues:
    types: [labeled, edited]

permissions:
  contents: read
  issues: write

concurrency:
  group: requirements-review-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      (github.event.action == 'labeled' &&
        (github.event.label.name == 'needs-security-review' || github.event.label.name == 'security-approved')) ||
      (github.event.action == 'edited' && github.event.changes.body)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # the context model always comes from main, never from a branch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r agents/requirements.txt
      - name: Requirements review flow
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENT_ENABLED: ${{ vars.AGENT_ENABLED }}
          SECURITY_REVIEWERS: ${{ vars.SECURITY_REVIEWERS }}
        run: python agents/requirements_agent.py
