name: Code security gate

# The deterministic layers of the pre-merge gate: SAST, secrets, dependencies, build.
# Each job is a required check on main.
#
# This workflow runs the PR's own code (build, tests), so it uses `pull_request`, never
# `pull_request_target`: it gets a read-only token and no secrets, so a malicious PR can
# run its code here but cannot reach anything worth stealing.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-security-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sast:
    name: sast
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install semgrep==1.178.*
      - name: Semgrep on the app, public rules plus our design-decision rules
        if: hashFiles('rupi-yeah/package.json') != ''
        run: |
          semgrep scan --metrics off --error \
            --config security/semgrep/rupi-yeah.yml \
            --config p/typescript --config p/react --config p/owasp-top-ten \
            rupi-yeah/app rupi-yeah/components rupi-yeah/lib rupi-yeah/proxy.ts
      - name: Semgrep on the agents
        run: semgrep scan --metrics off --error --config p/python --config p/owasp-top-ten agents

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scan every commit in the PR, not just the last one
      - name: Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --verbose --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  dependencies:
    name: dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: npm audit (production dependencies, high and above)
        if: hashFiles('rupi-yeah/package.json') != ''
        working-directory: rupi-yeah
        run: npm audit --omit=dev --audit-level=high
      - name: pip-audit (agent dependencies)
        run: pip install pip-audit && pip-audit -r agents/requirements.txt

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Does this branch contain the app?
        id: app
        run: echo "present=$([ -f rupi-yeah/package.json ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - if: steps.app.outputs.present == 'no'
        run: echo "No rupi-yeah/ app in this branch, nothing to build."
      - if: steps.app.outputs.present == 'yes'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rupi-yeah/package-lock.json
      - if: steps.app.outputs.present == 'yes'
        working-directory: rupi-yeah
        run: npm ci
      - if: steps.app.outputs.present == 'yes'
        working-directory: rupi-yeah
        run: npx next typegen
      - if: steps.app.outputs.present == 'yes'
        working-directory: rupi-yeah
        run: npx tsc --noEmit
      - if: steps.app.outputs.present == 'yes'
        working-directory: rupi-yeah
        run: npx eslint .
      - if: steps.app.outputs.present == 'yes'
        working-directory: rupi-yeah
        run: npx next build
